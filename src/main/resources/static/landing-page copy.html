<!DOCTYPE html>

<html lang="fr">
<head>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

body{
background:#020617;
color:#e2e8f0;
line-height:1.6;
}

/* HERO */

}

/* BUTTON */
.btn{

border-radius:20px;
background:#6366f1;
color:white;

}

/* TABLE */
.dashboard{

}

}

.boule-bleu{background:#3b82f6}
.boule-rouge{background:#ef4444}

/* GRID */
#grid49{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;

}

#chanceGrid{
display:flex;
gap:8px;
margin-top:15px;
}

.cell{
padding:10px;
border-radius:50%;

text-align:center;

.cell.selected{
background:#3b82f6;

.cell.chance.selected{
background:#ef4444;

<body>

<section class="hero">
<h1>Loto Tracker</h1>
<p>Simulation et analyse de tickets loto</p>
</section>

<section style="padding:50px 10%;">

<h2>Derniers résultats</h2>

<div class="dashboard">
<table>
<thead>
<tr>
<th>Date</th>
<th>Numéros</th>
<th>Chance</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<!-- GRILLE -->

<h3 style="margin-top:40px;">Grille Loto</h3>

<label>Choisir une date :</label> <select id="dateSelect"></select>

<h4>Numéros</h4>
<div id="grid49"></div>

<h4>Numéro Chance</h4>
<div id="chanceGrid"></div>

<button onclick="validerGrille()" class="btn">Valider mon ticket</button>

<div id="resultTicket"></div>

</section>

<script>

let lastDraws=[];
let selectedNums=[];
let selectedChance=null;

/* LOAD API */
async function loadResults(){

const res=await fetch("https://loto-tracker.fr/api/historique/last20");
const data=await res.json();

lastDraws=data;

/* TRI */
data.sort((a,b)=>{
const parse=d=>{
const [d1,m,y]=d.dateDeTirage.split("/");
return new Date(y,m-1,d1);
};
return parse(b)-parse(a);
});

/* TABLE */
const tbody=document.getElementById("tbody");

data.slice(0,10).forEach(draw=>{

const numsHTML=[
draw.boule1,
draw.boule2,
draw.boule3,
draw.boule4,
draw.boule5
].map(n=>`<span class="boule boule-bleu">${n}</span>`).join("");

const chanceHTML=`<span class="boule boule-rouge">${draw.numeroChance}</span>`;

tbody.innerHTML+=`
<tr>
<td>${draw.dateDeTirage}</td>
<td>${numsHTML}</td>
<td>${chanceHTML}</td>
</tr>
`;

});

/* SELECT DATE */
const select=document.getElementById("dateSelect");
data.forEach(draw=>{
const opt=document.createElement("option");
opt.value=draw.dateDeTirage;
opt.textContent=draw.dateDeTirage;
select.appendChild(opt);
});

}

/* GRID 49 */
function createGrid(){

const grid=document.getElementById("grid49");

for(let i=1;i<=49;i++){
const div=document.createElement("div");
div.className="cell";
div.textContent=i;

div.onclick=()=>{
if(selectedNums.includes(i)){
selectedNums=selectedNums.filter(n=>n!==i);
div.classList.remove("selected");
}else{
if(selectedNums.length<5){
selectedNums.push(i);
div.classList.add("selected");
}
}
};

grid.appendChild(div);
}

/* CHANCE */
const chanceGrid=document.getElementById("chanceGrid");

for(let i=1;i<=10;i++){
const div=document.createElement("div");
div.className="cell chance";
div.textContent=i;

div.onclick=()=>{
selectedChance=i;
document.querySelectorAll(".chance").forEach(c=>c.classList.remove("selected"));
div.classList.add("selected");
};

chanceGrid.appendChild(div);
}

}

/* VALIDATION */
function validerGrille(){

if(selectedNums.length!==5 || !selectedChance){
resultTicket.innerHTML="Sélectionne 5 numéros + 1 chance";
return;
}

const date=document.getElementById("dateSelect").value;

const draw=lastDraws.find(d=>d.dateDeTirage===date);

const tirage=[
draw.boule1,
draw.boule2,
draw.boule3,
draw.boule4,
draw.boule5
];

let match=selectedNums.filter(n=>tirage.includes(n)).length;
let chanceMatch=selectedChance===draw.numeroChance;

/* GAIN */
let gain="0€";

if(match===5 && chanceMatch) gain="Jackpot 💰";
else if(match===5) gain="~100k€";
else if(match===4 && chanceMatch) gain="~1k€";
else if(match===4) gain="~100€";
else if(match===3) gain="~20€";

resultTicket.innerHTML=`
<p>Date : ${date}</p>
<p>${match} bons numéros ${chanceMatch?"+ chance":""}</p>
<p><strong>${gain}</strong></p>
`;

}

/* INIT */
window.onload=()=>{
loadResults();
createGrid();
};

</script>

</body>
</html> -->

<body>

<section class="hero">
<h1>Loto Tracker</h1>
<p>Simulation et analyse de tickets loto</p>
</section>

<section style="padding:50px 10%;">

<h2>Derniers résultats</h2>

<div class="dashboard">
<table>
<thead>
<tr>
<th>Date</th>
<th>Numéros</th>
<th>Chance</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<h3 style="margin-top:40px;">Grille Loto</h3>

<label>Choisir une date :</label>
<select id="dateSelect"></select>

<h4>Numéros</h4>
<div id="grid49"></div>

<h4>Numéro Chance</h4>
<div id="chanceGrid"></div>

<button onclick="validerGrille()" class="btn">Valider mon ticket</button>

<div id="resultTicket"></div>

</section>

<script>

let lastDraws=[];
let selectedNums=[];
let selectedChance=null;

/* LOAD API */
async function loadResults(){

const res=await fetch("https://loto-tracker.fr/api/historique/last20");
const data=await res.json();

lastDraws=data;

/* TRI */
data.sort((a,b)=>{
const parse=d=>{
const [d1,m,y]=d.dateDeTirage.split("/");
return new Date(y,m-1,d1);
};
return parse(b)-parse(a);
});

/* TABLE */
const tbody=document.getElementById("tbody");

data.slice(0,10).forEach(draw=>{

const numsHTML=[
draw.boule1,
draw.boule2,
draw.boule3,
draw.boule4,
draw.boule5
].map(n=>`<span class="boule boule-bleu">${n}</span>`).join("");

const chanceHTML=`<span class="boule boule-rouge">${draw.numeroChance}</span>`;

tbody.innerHTML+=`
<tr>
<td>${draw.dateDeTirage}</td>
<td>${numsHTML}</td>
<td>${chanceHTML}</td>
</tr>
`;
});

/* SELECT */
const select=document.getElementById("dateSelect");
data.forEach(draw=>{
const opt=document.createElement("option");
opt.value=draw.dateDeTirage;
opt.textContent=draw.dateDeTirage;
select.appendChild(opt);
});
}

/* GRID */
function createGrid(){

const grid=document.getElementById("grid49");

for(let i=1;i<=49;i++){
const div=document.createElement("div");
div.className="cell";
div.textContent=i;

div.onclick=()=>{
if(selectedNums.includes(i)){
selectedNums=selectedNums.filter(n=>n!==i);
div.classList.remove("selected");
}else if(selectedNums.length<5){
selectedNums.push(i);
div.classList.add("selected");
}
};

grid.appendChild(div);
}

/* CHANCE */
const chanceGrid=document.getElementById("chanceGrid");

for(let i=1;i<=10;i++){
const div=document.createElement("div");
div.className="cell chance";
div.textContent=i;

div.onclick=()=>{
selectedChance=i;
document.querySelectorAll(".chance").forEach(c=>c.classList.remove("selected"));
div.classList.add("selected");
};

chanceGrid.appendChild(div);
}
}

/* VALIDATION */
function validerGrille(){

if(selectedNums.length!==5 || !selectedChance){
resultTicket.innerHTML="⚠️ Sélectionne 5 numéros + 1 chance";
return;
}

const date=document.getElementById("dateSelect").value;
const draw=lastDraws.find(d=>d.dateDeTirage===date);

const tirage=[
draw.boule1,
draw.boule2,
draw.boule3,
draw.boule4,
draw.boule5
];

let match=selectedNums.filter(n=>tirage.includes(n)).length;
let chanceMatch=selectedChance===draw.numeroChance;

/* GAIN */
let gain="0€";

if(match===5 && chanceMatch) gain="Jackpot 💰💰💰";
else if(match===5) gain="~100 000€";
else if(match===4 && chanceMatch) gain="~1 000€";
else if(match===4) gain="~100€";
else if(match===3) gain="~20€";

/* VISUEL */
const userHTML = selectedNums.map(n=>{
const win = tirage.includes(n);
return `<span class="boule ${win ? 'boule-win' : 'boule-bleu'}">${n}</span>`;
}).join("");

const chanceHTML = `
<span class="boule ${chanceMatch ? 'boule-win-chance' : 'boule-rouge'}">
${selectedChance}
</span>
`;

resultTicket.innerHTML=`
<h4>Résultat du tirage du ${date}</h4>

<div style="margin:10px 0;">
${userHTML} ${chanceHTML}
</div>

<p>${match} bons numéros ${chanceMatch ? "+ chance" : ""}</p>

<p style="font-size:1.2rem;">
💰 Gain estimé : <strong>${gain}</strong>
</p>
`;
}

/* INIT */
window.onload=()=>{
loadResults();
createGrid();
};

</script>

</body>
</html>
