<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loto Tracker — RNCP6</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

body{
background:linear-gradient(135deg,#020617,#020617,#0f172a);
color:#e2e8f0;
}

/* HERO */
.hero{
text-align:center;
padding:80px 20px;
}

.hero h1{
font-size:2.8rem;
background:linear-gradient(90deg,#6366f1,#a855f7);
-webkit-background-clip:text;
color:transparent;
}

/* GLASS CARD */
.glass{
background:rgba(30,41,59,0.6);
backdrop-filter:blur(15px);
border-radius:20px;
padding:30px;
margin-top:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

/* TABLE */
table{width:100%;border-collapse:collapse}

th,td{
border:1px solid #334155;
padding:10px;
text-align:center;
}

/* BOULES */
.boule{
display:inline-flex;
justify-content:center;
align-items:center;
width:36px;height:36px;
border-radius:50%;
margin:3px;
color:white;
font-weight:bold;
transition:0.2s;
}

.boule:hover{transform:scale(1.2)}

.boule-bleu{background:linear-gradient(#3b82f6,#1e3a8a)}
.boule-rouge{background:linear-gradient(#ef4444,#7f1d1d)}
.win{background:linear-gradient(#22c55e,#14532d)!important}
.winChance{background:linear-gradient(#eab308,#854d0e)!important}

/* GRID */
#grid49{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:8px;
margin-top:20px;
}

.cell{
padding:12px;
border-radius:50%;
background:#1e293b;
cursor:pointer;
text-align:center;
transition:0.2s;
}

.cell:hover{background:#334155}
.cell.selected{background:#3b82f6}

/* CHANCE */
#chanceGrid{
display:flex;
gap:10px;
margin-top:15px;
}

.cell.chance.selected{background:#ef4444}

/* BUTTON */
.btn{
margin-top:20px;
padding:12px 20px;
border-radius:25px;
background:linear-gradient(45deg,#6366f1,#a855f7);
border:none;
color:white;
cursor:pointer;
}

/* RESULT */
#result{
margin-top:20px;
padding:20px;
border-radius:15px;
background:#1e293b;
}

/* ANIMATION FDJ */
.spin{
animation:spin 0.6s ease;
}

@keyframes spin{
0%{transform:scale(0)}
50%{transform:scale(1.3)}
100%{transform:scale(1)}
}

</style>
</head>

<body>

<div class="hero">
<h1>Loto Tracker</h1>
<p>Simulation intelligente de tickets</p>
</div>

<div style="padding:40px">

<h2>Derniers tirages</h2>

<div class="glass">
<table>
<thead>
<tr>
<th>Date</th>
<th>Numéros</th>
<th>Chance</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<h2 style="margin-top:40px">Créer un ticket</h2>

<label>Date :</label>
<select id="dateSelect"></select>

<div id="grid49"></div>

<h3>Numéro Chance</h3>
<div id="chanceGrid"></div>

<button class="btn" onclick="valider()">Valider</button>

<div id="result"></div>

<h2 style="margin-top:40px">Stats</h2>
<div id="stats" class="glass"></div>

</div>

<script>

let draws=[];
let selected=[];
let chance=null;

/* LOAD */
async function load(){

const res=await fetch("https://loto-tracker.fr/api/historique/last20");
const data=await res.json();

draws=data;

/* TRI */
data.sort((a,b)=>{
const p=d=>{
const [d1,m,y]=d.dateDeTirage.split("/");
return new Date(y,m-1,d1);
};
return p(b)-p(a);
});

/* TABLE */
const tbody=document.getElementById("tbody");

data.slice(0,6).forEach(d=>{

const nums=[d.boule1,d.boule2,d.boule3,d.boule4,d.boule5]
.map(n=>`<span class="boule boule-bleu">${n}</span>`).join("");

tbody.innerHTML+=`
<tr>
<td>${d.dateDeTirage}</td>
<td>${nums}</td>
<td><span class="boule boule-rouge">${d.numeroChance}</span></td>
</tr>
`;

});

/* SELECT */
const sel=document.getElementById("dateSelect");
data.forEach(d=>{
const o=document.createElement("option");
o.value=d.dateDeTirage;
o.textContent=d.dateDeTirage;
sel.appendChild(o);
});

/* STATS */
calcStats(data);

}

/* GRID */
function grid(){

const g=document.getElementById("grid49");

for(let i=1;i<=49;i++){
const c=document.createElement("div");
c.className="cell";
c.textContent=i;

c.onclick=()=>{
if(selected.includes(i)){
selected=selected.filter(n=>n!==i);
c.classList.remove("selected");
}else if(selected.length<5){
selected.push(i);
c.classList.add("selected");
}
};

g.appendChild(c);
}

/* CHANCE */
const cg=document.getElementById("chanceGrid");

for(let i=1;i<=10;i++){
const c=document.createElement("div");
c.className="cell chance";
c.textContent=i;

c.onclick=()=>{
chance=i;
document.querySelectorAll(".chance").forEach(x=>x.classList.remove("selected"));
c.classList.add("selected");
};

cg.appendChild(c);
}

}

/* VALIDATION */
function valider(){

const resDiv=document.getElementById("result");

if(selected.length!==5 || !chance){
resDiv.innerHTML="❌ Sélection incomplète";
return;
}

const date=document.getElementById("dateSelect").value;
const draw=draws.find(d=>d.dateDeTirage===date);

const tirage=[draw.boule1,draw.boule2,draw.boule3,draw.boule4,draw.boule5];

let match=selected.filter(n=>tirage.includes(n));
let chanceOK=chance===draw.numeroChance;

/* animation */
resDiv.classList.add("spin");
setTimeout(()=>resDiv.classList.remove("spin"),600);

/* gain */
let gain="0€";
if(match.length===5 && chanceOK) gain="JACKPOT 💰";
else if(match.length===5) gain="~100k€";
else if(match.length===4 && chanceOK) gain="~1k€";
else if(match.length===4) gain="~100€";
else if(match.length===3) gain="~20€";

/* affichage */
resDiv.innerHTML=`
<p>Date : ${date}</p>
<p>Numéros joués : ${selected.join(", ")}</p>
<p>${match.length} bons numéros ${chanceOK?"+ chance":""}</p>
<p><strong>${gain}</strong></p>
`;

}

/* STATS */
function calcStats(data){

let freq={};

data.forEach(d=>{
[d.boule1,d.boule2,d.boule3,d.boule4,d.boule5].forEach(n=>{
freq[n]=(freq[n]||0)+1;
});
});

let sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,10);

document.getElementById("stats").innerHTML=
sorted.map(([n,f])=>`<p>${n} → ${f} fois</p>`).join("");

}

/* INIT */
window.onload=()=>{
load();
grid();
};

</script>

</body>
</html>
